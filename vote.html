<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vot Electronic Prezidențiale 2025 - Vot</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Vot Electronic - Prezidențiale România 2025</h1>
        <div id="voting" class="card">
            <h2>Alege candidatul</h2>
            <form id="vote-form">
                <div class="candidate-list">
                    <label class="candidate-card"><input type="radio" name="candidate" value="George-Nicolae Simion" required> 1. George-Nicolae Simion (AUR)</label>
                    <label class="candidate-card"><input type="radio" name="candidate" value="George-Crin-Laurențiu Antonescu"> 2. George-Crin-Laurențiu Antonescu (Alianța Electorală România Înainte)</label>
                    <label class="candidate-card"><input type="radio" name="candidate" value="Elena-Valerica Lasconi"> 3. Elena-Valerica Lasconi (USR)</label>
                    <label class="candidate-card"><input type="radio" name="candidate" value="Cristian-Vasile Terheș"> 4. Cristian-Vasile Terheș (PNCR)</label>
                    <label class="candidate-card"><input type="radio" name="candidate" value="Marcela-Lavinia Șandru"> 5. Marcela-Lavinia Șandru (PUSL)</label>
                    <label class="candidate-card"><input type="radio" name="candidate" value="Victor-Viorel Ponta"> 6. Victor-Viorel Ponta (Independent)</label>
                    <label class="candidate-card"><input type="radio" name="candidate" value="Sebastian-Constantin Popescu"> 7. Sebastian-Constantin Popescu (PNR)</label>
                    <label class="candidate-card"><input type="radio" name="candidate" value="Silviu Predoiu"> 8. Silviu Predoiu (PLAN)</label>
                    <label class="candidate-card"><input type="radio" name="candidate" value="John-Ion Banu-Muscel"> 9. John-Ion Banu-Muscel (Independent)</label>
                    <label class="candidate-card"><input type="radio" name="candidate" value="Petru-Daniel Funeriu"> 10. Petru-Daniel Funeriu (Independent)</label>
                    <label class="candidate-card"><input type="radio" name="candidate" value="Nicușor-Daniel Dan"> 11. Nicușor-Daniel Dan (Independent)</label>
                </div>
                <button type="submit">Votează Acum</button>
            </form>
            <p id="vote-message" class="message"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
